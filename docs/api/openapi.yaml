components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT emitido por Supabase Auth. Spring valida sub, usuario activo, permiso y scope.
  responses:
    Unauthorized:
      description: No autenticado o token inválido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Autenticado pero sin permiso o scope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflicto de versión (optimistic locking) o de identidad
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
    # ---- Catalogos
    HealthInsurer:
      type: object
      properties:
        id: { type: string, format: uuid }
        nit: { type: string }
        name: { type: string }
        code: { type: string, nullable: true }
        regime: { type: string, enum: [CONTRIBUTIVO, SUBSIDIADO, AMBOS] }
    MeResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        fullName: { type: string }
        institution:
          type: object
          properties:
            id: { type: string, format: uuid }
            code: { type: string }
            name: { type: string }
        roles:
          type: array
          items: { type: string }
        permissions:
          type: array
          items: { type: string }
        offlineWindowHours: { type: integer }
        lastOnlineValidation: { type: string, format: date-time }
    MetricsSummary:
      type: object
      properties:
        patientsAttended: { type: integer, format: int64 }
        dosesApplied: { type: integer, format: int64 }
    Vaccine:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
        category: { type: string }
        maxDoses: { type: integer }
        minAgeMonths: { type: integer, nullable: true }
        maxAgeMonths: { type: integer, nullable: true }
        hasLaboratory: { type: boolean }
        hasLot: { type: boolean }
        hasSyringe: { type: boolean }
        hasSyringeLot: { type: boolean }
        hasDiluent: { type: boolean }
        hasDropper: { type: boolean }
        hasPneumococcalType: { type: boolean }
        hasVialCount: { type: boolean }
        hasObservation: { type: boolean }
        active: { type: boolean }
        version: { type: integer }
    EffectiveCatalog:
      type: object
      properties:
        vaccines:
          type: array
          items:
            type: object
            properties:
              vaccineId: { type: string, format: uuid }
              name: { type: string }
              code: { type: string }
              doses:
                type: array
                items: { $ref: '#/components/schemas/CatalogOptionItem' }
              pneumococcalTypes:
                type: array
                items: { $ref: '#/components/schemas/CatalogOptionItem' }
              operationalOptions:
                type: array
                items: { $ref: '#/components/schemas/CatalogOptionItem' }
    CatalogOptionItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        fieldType: { type: string }
        value: { type: string }
        displayName: { type: string }
        sortOrder: { type: integer }
        isDefault: { type: boolean }
    ReferenceCatalog:
      type: object
      properties:
        code: { type: string }
        name: { type: string }
        options:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              label: { type: string }
              sortOrder: { type: integer }
    GeoUnit:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
    GeoMunicipality:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        departmentId: { type: string, format: uuid }
    GeoFullDepartment:
      type: object
      description: Departamento con sus municipios (precarga offline).
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        municipalities:
          type: array
          items:
            $ref: '#/components/schemas/GeoMunicipality'
    VaccineRequest:
      type: object
      required: [name, code, category, maxDoses]
      properties:
        name: { type: string }
        code: { type: string }
        category: { type: string }
        maxDoses: { type: integer, minimum: 1 }
        minAgeMonths: { type: integer, nullable: true }
        maxAgeMonths: { type: integer, nullable: true }
        hasLaboratory: { type: boolean }
        hasLot: { type: boolean }
        hasSyringe: { type: boolean }
        hasSyringeLot: { type: boolean }
        hasDiluent: { type: boolean }
        hasDropper: { type: boolean }
        hasPneumococcalType: { type: boolean }
        hasVialCount: { type: boolean }
        hasObservation: { type: boolean }
    Option:
      type: object
      properties:
        id: { type: string, format: uuid }
        vaccineId: { type: string, format: uuid }
        institutionId: { type: string, format: uuid, nullable: true }
        fieldType: { type: string }
        value: { type: string }
        displayName: { type: string }
        sortOrder: { type: integer }
        isDefault: { type: boolean }
        isActive: { type: boolean }
        sourceTemplateId: { type: string, format: uuid, nullable: true }
        version: { type: integer, format: int64 }
    OptionRequest:
      type: object
      required: [fieldType, value, displayName]
      properties:
        fieldType: { type: string }
        value: { type: string }
        displayName: { type: string }
        sortOrder: { type: integer }
        isDefault: { type: boolean }
        isActive: { type: boolean }
        version: { type: integer, format: int64 }
    InstitutionVaccine:
      type: object
      properties:
        id: { type: string, format: uuid }
        institutionId: { type: string, format: uuid }
        vaccineId: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
        category: { type: string }
        enabled: { type: boolean }
        version: { type: integer, format: int64 }
    CloneCatalogRequest:
      type: object
      properties:
        includeDefaultConfig: { type: boolean }
    CloneCatalogResponse:
      type: object
      properties:
        vaccinesEnabled: { type: integer }
        optionsCopied: { type: integer }
        vaccinesTotal: { type: integer }
    Institution:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        offlineWindowHours: { type: integer }
    CreateInstitutionRequest:
      type: object
      required: [code, name]
      properties:
        code: { type: string, maxLength: 32 }
        name: { type: string, maxLength: 200 }
        offlineWindowHours: { type: integer, minimum: 1, maximum: 168, nullable: true }
    UpdateInstitutionConfigRequest:
      type: object
      required: [offlineWindowHours]
      properties:
        offlineWindowHours: { type: integer, minimum: 1, maximum: 168 }
    StatusRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ACTIVE, INACTIVE] }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        fullName: { type: string }
        institutionId: { type: string, format: uuid }
        roles:
          type: array
          items: { type: string }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        documentType: { type: string, nullable: true }
        documentNumber: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        birthDate: { type: string, format: date, nullable: true }
        gender: { type: string, nullable: true }
        professionCode: { type: string, nullable: true }
        professionalRegistrationNumber: { type: string, nullable: true }
        professionalRegistrationType: { type: string, nullable: true }
    CreateInstitutionAdminRequest:
      type: object
      required: [email, fullName, institutionId, temporaryPassword, operationId]
      properties:
        email: { type: string }
        fullName: { type: string }
        institutionId: { type: string, format: uuid }
        temporaryPassword: { type: string, minLength: 8, maxLength: 128 }
        operationId: { type: string, format: uuid }
    CreateVaccinatorRequest:
      type: object
      required:
        [email, fullName, temporaryPassword, operationId, documentType, documentNumber, professionCode]
      properties:
        email: { type: string }
        fullName: { type: string }
        temporaryPassword: { type: string, minLength: 8, maxLength: 128 }
        operationId: { type: string, format: uuid }
        documentType: { type: string, enum: [CC, TI, CE, PASAPORTE] }
        documentNumber: { type: string, maxLength: 40 }
        phone: { type: string, nullable: true }
        birthDate: { type: string, format: date, nullable: true }
        gender: { type: string, enum: [FEMALE, MALE, OTHER], nullable: true }
        professionCode: { type: string, maxLength: 50 }
        professionalRegistrationNumber: { type: string, nullable: true }
        professionalRegistrationType: { type: string, nullable: true }
    UpdateUserRolesRequest:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          minItems: 1
          items: { type: string }
    ReconciliationResult:
      type: object
      properties:
        operationId: { type: string, format: uuid }
        authUserId: { type: string, format: uuid }
        email: { type: string }
        outcome:
          type: string
          enum:
            [RECONCILED, ALREADY_RECONCILED, SKIPPED_WITHOUT_OPERATION, SKIPPED_EMAIL_MISMATCH, FAILED]
        detail: { type: string }
    ProvisioningOperation:
      type: object
      properties:
        operationId: { type: string, format: uuid }
        authUserId: { type: string, format: uuid, nullable: true }
        email: { type: string }
        fullName: { type: string }
        institutionId: { type: string, format: uuid }
        role: { type: string }
        actorId: { type: string, format: uuid }
        status: { type: string }
        attempts: { type: integer }
        error: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    # ---- Pacientes
    CreatePatientRequest:
      type: object
      required: [documentType, documentNumber, firstName, lastName, birthDate, sex]
      properties:
        documentType: { type: string, maxLength: 20 }
        documentNumber: { type: string, maxLength: 40 }
        firstName: { type: string, maxLength: 120 }
        secondName: { type: string, maxLength: 120, nullable: true }
        lastName: { type: string, maxLength: 120 }
        secondLastName: { type: string, maxLength: 120, nullable: true }
        birthDate: { type: string, format: date }
        sex: { type: string, enum: [MALE, FEMALE, INDETERMINATE] }
        birthCountryId: { type: string, format: uuid, nullable: true }
        birthPlace: { type: string, maxLength: 200, nullable: true }
        migrationStatus: { type: string, maxLength: 20, nullable: true }
        gestationalAgeAtBirth: { type: integer, nullable: true }
        vaccinationCardType: { type: string, maxLength: 40, nullable: true }
        authorizeCalls: { type: boolean, nullable: true }
        authorizeEmail: { type: boolean, nullable: true }
        demographics:
          allOf: [{ $ref: '#/components/schemas/Demographic' }]
          nullable: true
        contacts:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/Contact' }
        addresses:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/Address' }
        guardians:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/Guardian' }
        medicalHistories:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/MedicalHistory' }
        affiliation:
          allOf: [{ $ref: '#/components/schemas/Affiliation' }]
          nullable: true
        specialConditions:
          allOf: [{ $ref: '#/components/schemas/SpecialConditions' }]
          nullable: true
        userCondition:
          allOf: [{ $ref: '#/components/schemas/UserCondition' }]
          nullable: true
    UpdatePatientContactRequest:
      type: object
      properties:
        contacts:
          type: array
          items: { $ref: '#/components/schemas/Contact' }
        addresses:
          type: array
          items: { $ref: '#/components/schemas/Address' }
    UpdatePatientIdentityRequest:
      type: object
      required: [firstName, lastName, birthDate, sex, justification]
      properties:
        firstName: { type: string, maxLength: 120 }
        lastName: { type: string, maxLength: 120 }
        birthDate: { type: string, format: date }
        sex: { type: string, enum: [MALE, FEMALE, INDETERMINATE] }
        justification: { type: string, minLength: 5, maxLength: 500 }
    UpdatePatientDemographicsRequest:
      type: object
      properties:
        gender: { type: string, maxLength: 20, nullable: true }
        ethnicity: { type: string, maxLength: 80, nullable: true }
        educationLevel: { type: string, maxLength: 120, nullable: true }
    UpdatePatientMedicalHistoriesRequest:
      type: object
      properties:
        medicalHistories:
          type: array
          items: { $ref: '#/components/schemas/MedicalHistory' }
    Patient:
      type: object
      description: Paciente autorizado con su agregado completo.
      properties:
        id: { type: string, format: uuid }
        institutionId: { type: string, format: uuid }
        documentType: { type: string }
        documentNumber: { type: string }
        firstName: { type: string }
        secondName: { type: string, nullable: true }
        lastName: { type: string }
        secondLastName: { type: string, nullable: true }
        birthDate: { type: string, format: date }
        sex: { type: string, enum: [MALE, FEMALE, INDETERMINATE] }
        birthCountryId: { type: string, format: uuid, nullable: true }
        birthPlace: { type: string, nullable: true }
        migrationStatus: { type: string, nullable: true }
        gestationalAgeAtBirth: { type: integer, nullable: true }
        vaccinationCardType: { type: string, nullable: true }
        authorizeCalls: { type: boolean }
        authorizeEmail: { type: boolean }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        demographics:
          allOf: [{ $ref: '#/components/schemas/Demographic' }]
          nullable: true
        contacts:
          type: array
          items: { $ref: '#/components/schemas/Contact' }
        addresses:
          type: array
          items: { $ref: '#/components/schemas/Address' }
        guardians:
          type: array
          items: { $ref: '#/components/schemas/Guardian' }
        medicalHistories:
          type: array
          items: { $ref: '#/components/schemas/MedicalHistory' }
        affiliation:
          allOf: [{ $ref: '#/components/schemas/Affiliation' }]
          nullable: true
        specialConditions:
          allOf: [{ $ref: '#/components/schemas/SpecialConditions' }]
          nullable: true
        userCondition:
          allOf: [{ $ref: '#/components/schemas/UserCondition' }]
          nullable: true
    Demographic:
      type: object
      properties:
        gender: { type: string, nullable: true }
        ethnicity: { type: string, nullable: true }
        sexualOrientation: { type: string, nullable: true }
        educationLevel: { type: string, nullable: true }
    Contact:
      type: object
      required: [type, value]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [PHONE, EMAIL, OTHER] }
        value: { type: string, maxLength: 120 }
        phoneKind: { type: string, nullable: true }
        primary: { type: boolean }
    Address:
      type: object
      properties:
        id: { type: string, format: uuid }
        street: { type: string, nullable: true }
        municipalityId: { type: string, format: uuid, nullable: true }
        departmentId: { type: string, format: uuid, nullable: true }
        countryId: { type: string, format: uuid, nullable: true }
        locality: { type: string, nullable: true }
        area: { type: string, nullable: true }
        primary: { type: boolean }
    Guardian:
      type: object
      required: [relationship, fullName]
      properties:
        id: { type: string, format: uuid }
        relationship: { type: string, enum: [MOTHER, FATHER, CAREGIVER, OTHER] }
        fullName: { type: string, maxLength: 120 }
        secondName: { type: string, nullable: true }
        secondLastName: { type: string, nullable: true }
        documentType: { type: string, nullable: true }
        documentNumber: { type: string, nullable: true }
        phone: { type: string, maxLength: 10, nullable: true }
        landline: { type: string, maxLength: 10, nullable: true }
        cellphone: { type: string, maxLength: 10, nullable: true }
        email: { type: string, nullable: true }
        affiliationRegime: { type: string, nullable: true }
        insurer: { type: string, nullable: true }
        insurerCode: { type: string, nullable: true }
        ethnicity: { type: string, nullable: true }
        displaced: { type: boolean, nullable: true }
    MedicalHistory:
      type: object
      required: [condition]
      properties:
        id: { type: string, format: uuid }
        condition: { type: string, maxLength: 200 }
        diagnosedAt: { type: string, format: date, nullable: true }
        notes: { type: string, nullable: true }
        hasContraindication: { type: boolean }
        contraindicationDetails: { type: string, nullable: true }
        hasPreviousReaction: { type: boolean }
        reactionDetails: { type: string, nullable: true }
        historyType: { type: string, nullable: true }
        specialObservations: { type: string, nullable: true }
    Affiliation:
      type: object
      required: [affiliationRegime, insurer]
      properties:
        affiliationRegime: { type: string, maxLength: 40 }
        insurer: { type: string, maxLength: 120 }
        insurerCode: { type: string, maxLength: 40, nullable: true }
    SpecialConditions:
      type: object
      properties:
        displaced: { type: boolean }
        disabled: { type: boolean }
        deceased: { type: boolean }
        armedConflictVictim: { type: boolean }
        currentlyStudying: { type: boolean, nullable: true }
    UserCondition:
      type: object
      properties:
        userCondition: { type: string, nullable: true }
        lastMenstrualDate: { type: string, format: date, nullable: true }
        gestationWeeks: { type: integer, nullable: true }
        probableDeliveryDate: { type: string, format: date, nullable: true }
        previousPregnancies: { type: integer, nullable: true }
        hasGivenBirth: { type: boolean, nullable: true }
        birthPlaceDelivery: { type: string, nullable: true }
    PatientSummary:
      type: object
      description: Vista ligera para busquedas (identidad, sin sub-entidades).
      properties:
        id: { type: string, format: uuid }
        institutionId: { type: string, format: uuid }
        documentType: { type: string }
        documentNumber: { type: string }
        firstName: { type: string }
        secondName: { type: string, nullable: true }
        lastName: { type: string }
        secondLastName: { type: string, nullable: true }
        birthDate: { type: string, format: date, nullable: true }
        sex: { type: string }
        birthCountryId: { type: string, format: uuid, nullable: true }
        birthPlace: { type: string, nullable: true }
        migrationStatus: { type: string, nullable: true }
        gestationalAgeAtBirth: { type: integer, nullable: true }
        vaccinationCardType: { type: string, nullable: true }
        authorizeCalls: { type: boolean }
        authorizeEmail: { type: boolean }
        status: { type: string }
    # ---- Atenciones
    CreateAttentionRequest:
      type: object
      required: [patientId]
      properties:
        patientId: { type: string, format: uuid }
        attentionDate: { type: string, format: date-time, nullable: true }
        observations: { type: string, nullable: true, maxLength: 2000 }
        completeScheme: { type: boolean, nullable: true }
        paiwebRegistered: { type: boolean, nullable: true }
        paiwebNotRegisteredReason: { type: string, nullable: true, maxLength: 500 }
    UpdateAttentionRequest:
      type: object
      required: [version]
      properties:
        attentionDate: { type: string, format: date-time, nullable: true }
        observations: { type: string, nullable: true, maxLength: 2000 }
        completeScheme: { type: boolean, nullable: true }
        paiwebRegistered: { type: boolean, nullable: true }
        paiwebNotRegisteredReason: { type: string, nullable: true, maxLength: 500 }
        version: { type: integer }
    CancelAttentionRequest:
      type: object
      required: [operationId, reason]
      properties:
        operationId: { type: string, format: uuid }
        reason: { type: string }
    AttentionStatus:
      type: string
      enum: [DRAFT, IN_PROGRESS, COMPLETED, CANCELLED]
    Attention:
      type: object
      properties:
        id: { type: string, format: uuid }
        institutionId: { type: string, format: uuid }
        patientId: { type: string, format: uuid }
        vaccinatorId: { type: string, format: uuid, nullable: true }
        status:
          $ref: '#/components/schemas/AttentionStatus'
        startedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        cancelReason: { type: string, nullable: true }
        version: { type: integer }
        doses:
          type: array
          items:
            $ref: '#/components/schemas/AppliedDose'
    # ---- Dosis
    RegisterDoseRequest:
      type: object
      required: [vaccineId, doseOptionId]
      properties:
        vaccineId: { type: string, format: uuid }
        doseOptionId: { type: string, format: uuid }
        pneumococcalTypeOptionId: { type: string, format: uuid, nullable: true }
        applicationDate: { type: string, format: date-time, nullable: true }
        lotId: { type: string, format: uuid, nullable: true }
        lotNumber: { type: string, nullable: true, maxLength: 60 }
        selectedLaboratoryId: { type: string, format: uuid, nullable: true }
        selectedSyringeId: { type: string, format: uuid, nullable: true }
        selectedDropperId: { type: string, format: uuid, nullable: true }
        selectedObservationId: { type: string, format: uuid, nullable: true }
        syringeLot: { type: string, nullable: true, maxLength: 60 }
        diluent: { type: string, nullable: true, maxLength: 120 }
        vialCount: { type: integer, nullable: true }
        customObservation: { type: string, nullable: true, maxLength: 500 }
    CancelDoseRequest:
      type: object
      required: [operationId, reason]
      properties:
        operationId: { type: string, format: uuid }
        reason: { type: string }
    AppliedDose:
      type: object
      properties:
        id: { type: string, format: uuid }
        attentionId: { type: string, format: uuid }
        vaccineId: { type: string, format: uuid }
        status:
          type: string
          enum: [REGISTERED, CANCELLED]
        appliedAt: { type: string, format: date-time }
        lot: { type: string, nullable: true }
        vaccineNameSnapshot: { type: string }
        doseLabelSnapshot: { type: string, nullable: true }
        cancelReason: { type: string, nullable: true }
        cancelledAt: { type: string, format: date-time, nullable: true }
    # ---- Sync (semántica en sync-contract.md)
    # Nota: los endpoints directos (/patients, /attentions) transportan los
    # mismos comandos que /sync/push y comparten la misma idempotencia por
    # operation_id (tabla processed_operations). Ver "Dos caminos de transporte"
    # en docs/synchronization/sync-contract.md.
    SyncOperation:
      type: object
      required: [operationId, commandType, aggregateId, payload]
      properties:
        operationId: { type: string, format: uuid }
        commandType:
          type: string
          enum: [
            CREATE_PATIENT, UPDATE_PATIENT_CONTACT, UPDATE_PATIENT_IDENTITY,
            CREATE_ATTENTION, UPDATE_ATTENTION, REGISTER_APPLIED_DOSE,
            COMPLETE_ATTENTION, CANCEL_APPLIED_DOSE, CANCEL_ATTENTION
          ]
        aggregateId: { type: string, format: uuid }
        payload:
          type: object
          additionalProperties: true
        dependencies:
          type: array
          items: { type: string, format: uuid }
    SyncPushRequest:
      type: object
      required: [operations]
      properties:
        operations:
          type: array
          items:
            $ref: '#/components/schemas/SyncOperation'
    RejectedOperation:
      type: object
      properties:
        operationId: { type: string, format: uuid }
        reason:
          type: string
          enum: [
            DEPENDENCY_NOT_FOUND, DEPENDENCY_FAILED, DUPLICATE_BUSINESS_IDENTITY,
            PERMISSION_DENIED, USER_NOT_ACTIVE, INVALID_STATE, INVALID_PAYLOAD
          ]
        error: { type: string }
    SyncPushResponse:
      type: object
      properties:
        accepted:
          type: array
          items: { type: string, format: uuid }
        rejected:
          type: array
          items:
            $ref: '#/components/schemas/RejectedOperation'
    SyncPullResponse:
      type: object
      properties:
        operations:
          type: array
          items:
            $ref: '#/components/schemas/SyncOperation'
        nextCursor:
          type: string
          example: "42|2026-09-07T10:00:00Z"
