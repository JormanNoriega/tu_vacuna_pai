openapi: 3.0.3
info:
  title: Tu Vacuna PAI — API
  description: >
    Contrato HTTP de la API de Tu Vacuna PAI. Este documento es la AUTORIDAD del
    transporte HTTP (endpoints, status codes, JSON). La semántica de la
    sincronización (comandos, estados, idempotencia, cursor, conflictos) NO se
    redefine aquí: vive en `docs/synchronization/sync-contract.md`, al que este
    documento referencia.
  version: v1
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Patients
  - name: Attentions
  - name: Sync
  - name: Conflicts
paths:
  # ------------------------------------------------------------------ Patients
  /patients:
    post:
      tags: [Patients]
      summary: Crear paciente (transporta CREATE_PATIENT)
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: operation_id generado por el movil (idempotencia D3)
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePatientRequest'
      responses:
        '201':
          description: Paciente creado o ya existente (idempotente por Idempotency-Key)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      tags: [Patients]
      summary: Buscar pacientes por documento en el scope del actor
      security:
        - bearerAuth: []
      parameters:
        - name: documentType
          in: query
          required: false
          schema:
            type: string
        - name: documentNumber
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Lista ligera de pacientes (sin sub-entidades)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PatientSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /patients/{id}:
    get:
      tags: [Patients]
      summary: Obtener un paciente por id
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Paciente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /patients/{id}/contact:
    put:
      tags: [Patients]
      summary: Actualizar contacto del paciente (transporta UPDATE_PATIENT_CONTACT)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePatientContactRequest'
      responses:
        '200':
          description: Paciente actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /patients/{id}/identity:
    put:
      tags: [Patients]
      summary: Actualizar identidad (transporta UPDATE_PATIENT_IDENTITY; requiere justificación)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePatientIdentityRequest'
      responses:
        '200':
          description: Paciente actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /patients/{id}/demographics:
    put:
      tags: [Patients]
      summary: Actualizar demografia del paciente (1:1)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePatientDemographicsRequest'
      responses:
        '200':
          description: Paciente actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /patients/{id}/medical-histories:
    put:
      tags: [Patients]
      summary: Reemplazar antecedentes medicos del paciente
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePatientMedicalHistoriesRequest'
      responses:
        '200':
          description: Paciente actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  # -------------------------------------------------------------- Attentions
  /attentions:
    post:
      tags: [Attentions]
      summary: Crear atención (transporta CREATE_ATTENTION)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAttentionRequest'
      responses:
        '200':
          description: Atención creada (DRAFT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attention'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      tags: [Attentions]
      summary: Listar atenciones del scope del actor
      security:
        - bearerAuth: []
      parameters:
        - name: patientId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/AttentionStatus'
      responses:
        '200':
          description: Lista de atenciones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Attention'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /attentions/{id}:
    get:
      tags: [Attentions]
      summary: Obtener una atención con sus dosis
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Atención
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attention'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Attentions]
      summary: Modificar atención en DRAFT/IN_PROGRESS (transporta UPDATE_ATTENTION)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAttentionRequest'
      responses:
        '200':
          description: Atención actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attention'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /attentions/{id}/complete:
    post:
      tags: [Attentions]
      summary: Completar atención (transporta COMPLETE_ATTENTION)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Atención COMPLETED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attention'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /attentions/{id}/cancel:
    post:
      tags: [Attentions]
      summary: Anular atención con motivo (transporta CANCEL_ATTENTION)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelAttentionRequest'
      responses:
        '200':
          description: Atención CANCELLED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attention'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /attentions/{id}/doses:
    post:
      tags: [Attentions]
      summary: Registrar dosis aplicada (transporta REGISTER_APPLIED_DOSE, append-only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDoseRequest'
      responses:
        '200':
          description: Dosis registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppliedDose'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /attentions/{id}/doses/{doseId}/cancel:
    post:
      tags: [Attentions]
      summary: Anular dosis con motivo (transporta CANCEL_APPLIED_DOSE, append-only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: doseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelDoseRequest'
      responses:
        '200':
          description: Dosis CANCELLED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppliedDose'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  # ------------------------------------------------------------------ Catalogos
  /catalogs/insurers:
    get:
      tags: [Catalogs]
      summary: Listar aseguradoras en salud (EPS) activas
      description: >
        Catalogo global de EPS. Con `regime` filtra por regimen incluyendo
        siempre las de regimen `AMBOS`. Solo devuelve `is_active = true`.
      parameters:
        - name: regime
          in: query
          required: false
          schema:
            type: string
            enum: [CONTRIBUTIVO, SUBSIDIADO, AMBOS]
      responses:
        '200':
          description: Lista de aseguradoras activas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HealthInsurer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  # ------------------------------------------------------------------- Sync
  # Semántica completa de comandos/estados/cursor en docs/synchronization/sync-contract.md
  /sync/push:
    post:
      tags: [Sync]
      summary: Enviar batch de operaciones pendientes (outbox del cliente)
      description: >
        Transporta los comandos definidos en sync-contract.md. Idempotente por
        operation_id; atómico por operación. Un operation_id ya conocido devuelve
        la respuesta original sin reprocesar.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncPushRequest'
      responses:
        '200':
          description: Resultado del push (accepted / rejected)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPushResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /sync/pull:
    get:
      tags: [Sync]
      summary: Obtener operaciones del scope no vistas por el cliente
      description: >
        Cursor compuesto (sync_sequence + created_at). Consulta inclusiva sobre
        sync_sequence; el cliente deduplica por operation_id. Ver sync-contract.md.
      security:
        - bearerAuth: []
      parameters:
        - name: since
          in: query
          required: false
          schema:
            type: string
            example: "0|"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 500
      responses:
        '200':
          description: Operaciones y próximo cursor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPullResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  # ------------------------------------------------------------------ Identity
  /me:
    get:
      tags: [Identity]
      summary: Perfil autorizado del usuario autenticado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Perfil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  # ------------------------------------------------------------------- Reports
  /metrics/summary:
    get:
      tags: [Reports]
      summary: Metricas del home (pacientes atendidos y dosis aplicadas)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Resumen de metricas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  # ------------------------------------------------------------------ Catalogs
  /catalogs/effective:
    get:
      tags: [Catalogs]
      summary: Catalogo efectivo de la institucion del actor
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Catalogo efectivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EffectiveCatalog'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /catalogs/reference:
    get:
      tags: [Catalogs]
      summary: Catalogos de referencia (listas cerradas del legacy)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Catalogos de referencia
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReferenceCatalog'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /catalogs/geo/countries:
    get:
      tags: [Catalogs]
      summary: Paises (DIVIPOLA)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de paises
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GeoUnit'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /catalogs/geo/departments:
    get:
      tags: [Catalogs]
      summary: Departamentos (DIVIPOLA)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de departamentos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GeoUnit'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /catalogs/geo/municipalities:
    get:
      tags: [Catalogs]
      summary: Municipios de un departamento (DIVIPOLA)
      security:
        - bearerAuth: []
      parameters:
        - name: departmentId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Lista de municipios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GeoMunicipality'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /catalogs/geo/full:
    get:
      tags: [Catalogs]
      summary: Catalogo geografico completo (departamentos con municipios) para precarga offline
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Departamentos con sus municipios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GeoFullDepartment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /catalogs/vaccines:
    get:
      tags: [Catalogs]
      summary: Catalogo global de vacunas activas
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de vacunas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Vaccine'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Catalogs]
      summary: Crear vacuna (CATALOG_GLOBAL_WRITE)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VaccineRequest'
      responses:
        '201':
          description: Vacuna creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vaccine'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /catalogs/vaccines/{id}:
    put:
      tags: [Catalogs]
      summary: Actualizar vacuna (optimista por version)
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: version, in: query, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VaccineRequest'
      responses:
        '200':
          description: Vacuna actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vaccine'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [Catalogs]
      summary: Desactivar vacuna (optimista por version)
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: version, in: query, required: true, schema: { type: integer, format: int64 } }
      responses:
        '204':
          description: Vacuna desactivada
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /catalogs/vaccines/{id}/options:
    get:
      tags: [Catalogs]
      summary: Opciones globales de una vacuna
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Opciones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Option'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Catalogs]
      summary: Crear opcion global
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OptionRequest'
      responses:
        '201':
          description: Opcion creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Option'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /catalogs/vaccines/{vaccineId}/options/{id}:
    put:
      tags: [Catalogs]
      summary: Actualizar opcion global
      security:
        - bearerAuth: []
      parameters:
        - { name: vaccineId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OptionRequest'
      responses:
        '200':
          description: Opcion actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Option'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [Catalogs]
      summary: Desactivar opcion global
      security:
        - bearerAuth: []
      parameters:
        - { name: vaccineId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: version, in: query, required: true, schema: { type: integer, format: int64 } }
      responses:
        '204':
          description: Opcion desactivada
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /catalogs/vaccines/{id}/templates:
    get:
      tags: [Catalogs]
      summary: Templates de una vacuna
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Option'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
