spring:
  application:
    name: api

  # --- Carga de variables locales (dev) ---
  # Spring Boot lee .env por defecto, no .env.local. Con este import se respeta
  # la convencion del repo (.env.local, gitignored). Se listan ambas rutas para
  # funcionar tanto al correr desde la raiz del repo (VS Code) como desde
  # services/api (terminal). En produccion no existe el archivo y el prefijo
  # "optional:" lo ignora.
  config:
    import: optional:file:./.env.local[.properties],optional:file:./services/api/.env.local[.properties]

  # ===== PostgreSQL (Supabase) =====
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pai}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      max-lifetime: 600000
      idle-timeout: 120000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

  # --- Flyway (migraciones) ---
  flyway:
    enabled: true
    locations: classpath:db/migration
    # El esquema de negocio vive en "app". Con baseline-on-migrate, si la BD ya
    # tiene el esquema (p. ej. migrado via Supabase), Flyway adopta el estado
    # actual en la version 1 y no reintenta V1.
    schemas: app
    baseline-on-migrate: true
    validate-on-migrate: true

  # --- Seguridad: Supabase Auth como Resource Server ---
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SUPABASE_AUTH_ISSUER:https://jfxkrznzhfvecaaixkjv.supabase.co/auth/v1}

  jackson:
    default-property-inclusion: non_null

# --- Edge Functions de Supabase (aprovisionamiento de identidad) ---
app:
  auth-functions-url: ${AUTH_FUNCTIONS_URL:https://jfxkrznzhfvecaaixkjv.supabase.co/functions/v1}
  # Funcionalidades disponibles por defecto; conservan sus permisos y controles.
  inventory:
    api-enabled: true
    custody-workflow-enabled: true
    reservations-enabled: true
    installation-keys-enabled: true

  # La politica de privacidad geografica sigue pendiente para datos de produccion.
  geography:
    enabled: true
    cell-size-degrees: ${APP_GEOGRAPHY_CELL_SIZE_DEGREES:0.018}
    minimum-attentions: ${APP_GEOGRAPHY_MINIMUM_ATTENTIONS:5}
    allowed-periods: ${APP_GEOGRAPHY_ALLOWED_PERIODS:7,30,90}
    default-period: ${APP_GEOGRAPHY_DEFAULT_PERIOD:30}
    cache-ttl: 30m
    cache-maximum-size: 500

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,flyway
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.pai: INFO
    org.springframework.security: INFO
