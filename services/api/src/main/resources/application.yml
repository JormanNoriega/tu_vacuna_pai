spring:
  application:
    name: api

  # --- Carga de variables locales (dev) ---
  # Spring Boot lee .env por defecto, no .env.local. Con este import se respeta
  # la convencion del repo (.env.local, gitignored). Se listan ambas rutas para
  # funcionar tanto al correr desde la raiz del repo (VS Code) como desde
  # services/api (terminal). En produccion no existe el archivo y el prefijo
  # "optional:" lo ignora.
  config:
    import: optional:file:./.env.local[.properties],optional:file:./services/api/.env.local[.properties]

  # ===== PostgreSQL (Supabase) =====
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pai}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

  # --- Flyway (migraciones) ---
  flyway:
    enabled: true
    locations: classpath:db/migration
    # El esquema de negocio vive en "app". Con baseline-on-migrate, si la BD ya
    # tiene el esquema (p. ej. migrado via Supabase), Flyway adopta el estado
    # actual en la version 1 y no reintenta V1.
    schemas: app
    baseline-on-migrate: true
    validate-on-migrate: true

  # --- Seguridad: Supabase Auth como Resource Server ---
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SUPABASE_AUTH_ISSUER:https://jfxkrznzhfvecaaixkjv.supabase.co/auth/v1}

  jackson:
    default-property-inclusion: non_null

# --- Edge Functions de Supabase (aprovisionamiento de identidad) ---
app:
  auth-functions-url: ${AUTH_FUNCTIONS_URL:https://jfxkrznzhfvecaaixkjv.supabase.co/functions/v1}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,flyway
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.pai: INFO
    org.springframework.security: INFO